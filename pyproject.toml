[project]
name = "libresprite-mcp"
version = "0.2.0"
description = "Safe, structured MCP bridge for LibreSprite pixel-art editing and animation"
readme = "README.md"
authors = [
  { name = "Snehil Shah" },
  { name = "indira0003 fork maintainers" }
]
requires-python = ">=3.11,<3.14"
license = { text = "GPL-2.0-only" }
dependencies = [
  "flask>=3.1.2,<3.2",
  "mcp[cli]>=1.23,<2",
  "pillow>=11.3,<13",
  "werkzeug>=3.1.5,<3.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "pip-audit>=2.9,<3",
  "ruff>=0.12,<0.16",
]

[project.scripts]
libresprite-mcp = "libresprite_mcp:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/libresprite_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
