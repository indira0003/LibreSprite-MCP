name: CI

on:
  push:
    branches:
      - astra-safe-animation-mcp
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: "0.12.10"
          enable-cache: true
      - name: Validate LibreSprite bridge JavaScript
        run: node --check remote/mcp.js
      - name: Generate lock
        run: uv lock
      - name: Commit regenerated lock on branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/astra-safe-animation-mcp'
        run: |
          if ! git diff --quiet -- uv.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add uv.lock
            git commit -m "chore: regenerate uv.lock"
            git push origin HEAD:astra-safe-animation-mcp
          fi
      - name: Sync
        run: uv sync --extra dev --locked
      - name: Unit tests
        run: uv run pytest -q
      - name: Ruff
        run: uv run ruff check src tests
      - name: Dependency audit
        run: uv run pip-audit
      - name: Upload generated lock
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: uv-lock
          path: uv.lock
          if-no-files-found: error
